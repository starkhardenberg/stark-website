[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Staging-domein: dezelfde pagina op het definitieve domein.
[[redirects]]
  from = "/*"
  to = "https://www.starkhardenberg.nl/:splat"
  status = 301
  force = true

  [redirects.conditions]
    Host = ["stark.roholt.nl"]

# Oude WordPress-paden. Zowel met als zonder slash.
# /contact/ niet hierheen sturen: Netlify past een regel met slash ook toe
# op /contact zelf, en dan wijst /contact naar /contact.
