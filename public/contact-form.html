<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Contactformulier STARK</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <p class="hidden"><label>Laat dit veld leeg: <input name="bot-field" /></label></p>
      <input type="text" name="naam" />
      <input type="email" name="email" />
      <input type="tel" name="telefoon" />
      <select name="ontdekt">
        <option value="via-lid">Via iemand die bij STARK! traint</option>
        <option value="via-kennis">Via vriend(in) of familie</option>
        <option value="google">Google of online zoeken</option>
        <option value="social">Social media</option>
        <option value="langsgelopen">Langsgelopen of voorbij gereden</option>
        <option value="werkgever">Via werkgever of bedrijf</option>
        <option value="doorverwijzing">Doorverwijzing</option>
        <option value="anders">Anders</option>
      </select>
      <input type="text" name="ontdekt_via_naam" />
      <input type="text" name="ontdekt_anders" />
      <select name="onderwerp">
        <option value="trainen">Trainen</option>
        <option value="coaching">Coaching</option>
        <option value="zakelijk">Zakelijk</option>
        <option value="anders">Anders</option>
      </select>
      <textarea name="bericht"></textarea>
    </form>
  </body>
</html>
